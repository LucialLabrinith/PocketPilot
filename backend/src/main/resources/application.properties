# =====================================================================
# PocketPilot Spring Boot 3 Backend Configuration
# =====================================================================
server.port=8080
server.servlet.context-path=/api

# Application Profile
spring.profiles.active=dev

# MySQL 8 Datasource Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pocketpilot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Email & OTP Configuration
pocketpilot.otp.expiration-minutes=10
pocketpilot.otp.max-resend-attempts=3
pocketpilot.otp.resend-window-minutes=15
pocketpilot.otp.dev-mode=${POCKETPILOT_OTP_DEV_MODE:true}

# Optional real SMTP configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
